name: Sync datos hoja -> data/
on:
  schedule:
    - cron: '17 * * * *'        # cada hora (minuto 17 para evitar picos)
  workflow_dispatch:            # ejecutar manualmente desde Actions
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Descargar datos de la hoja
        run: node scripts/sync_data.mjs
      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
          else
            git commit -m "Auto-sync datos desde la hoja ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
