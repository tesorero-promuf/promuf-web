<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a1830">
<meta name="description" content="Carnetizacion Digital PROMUF - Profesionales de la Musica de Falcon">
<title>Carnetizacion Digital &middot; PROMUF</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --navy:#0a1830;--navy2:#060f1f;--navy3:#0e2244;
  --teal:#3fd0c9;--teal2:#7fe3d4;--teal3:#0d5c5c;
  --gold:#e6c468;--gold2:#d4af37;
  --green:#1d9e75;--red:#e24b4a;--gray:#6b7280;--gray2:#9ca3af;
}
*,*::before,*::after{box-sizing:border-box;}
html{background:var(--navy2);}
body{margin:0;min-height:100vh;font-family:'Poppins',sans-serif;color:#fff;
  background:linear-gradient(160deg,#0d1e3a 0%,var(--navy2) 100%);}

/* ── Topbar ─────────────────────────────────────────── */
.tb{display:flex;align-items:center;gap:10px;padding:12px 20px;
  background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);}
.tb img{width:34px;height:34px;border-radius:50%;object-fit:cover;}
.tb .br{font-size:13px;font-weight:700;}
.tb .br .pro{color:var(--teal2);}.tb .br .muf{color:var(--gold);}
.tb .br .sub{display:block;font-size:8.5px;font-weight:400;color:#8ab0c8;margin-top:-1px;letter-spacing:.3px;}

/* ── Wrapper ────────────────────────────────────────── */
.pg{max-width:460px;margin:0 auto;padding:32px 18px 80px;}

/* ── Panel genérico ─────────────────────────────────── */
.panel{animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.ptitle{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px;line-height:1.2;}
.psub{font-size:13px;color:#8ab0c8;text-align:center;margin-bottom:28px;line-height:1.6;}

/* ── Input cédula ───────────────────────────────────── */
.ced-wrap{position:relative;margin-bottom:10px;}
.ced-pre{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:16px;font-weight:700;color:var(--teal2);pointer-events:none;letter-spacing:.5px;}
.ced-in{width:100%;padding:16px 16px 16px 50px;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);
  border-radius:14px;color:#fff;font-size:20px;font-weight:700;
  font-family:'Poppins',sans-serif;letter-spacing:1.5px;
  transition:border-color .2s;caret-color:var(--teal);}
.ced-in:focus{outline:none;border-color:var(--teal);}
.ced-in::placeholder{font-weight:400;font-size:15px;color:var(--gray2);letter-spacing:0;}
.ced-hint{font-size:11.5px;color:var(--gray2);text-align:center;margin-bottom:22px;}
.ced-in[aria-invalid="true"]{border-color:var(--red);}

/* ── Botones ────────────────────────────────────────── */
.btn{width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;
  font-size:14px;font-weight:700;font-family:'Poppins',sans-serif;letter-spacing:.5px;
  transition:opacity .2s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{transform:scale(.97);}.btn:hover{opacity:.88;}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-teal{background:linear-gradient(135deg,var(--teal),#1aa39a);color:#fff;
  box-shadow:0 4px 20px rgba(63,208,201,.28);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy2);
  box-shadow:0 4px 20px rgba(230,196,104,.22);}
.btn-ghost{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);
  color:#c8d8ec;margin-top:10px;}

/* ── Spinner ────────────────────────────────────────── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:50vh;gap:16px;text-align:center;}
.spin{width:42px;height:42px;border-radius:50%;
  border:3px solid rgba(63,208,201,.18);border-top-color:var(--teal);
  animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.spin-msg{font-size:14px;color:#8ab0c8;}

/* ── Tarjeta de confirmación ────────────────────────── */
.ok-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
  border-radius:18px;padding:22px 18px;text-align:center;margin-bottom:20px;}
.ok-badge{display:inline-flex;align-items:center;gap:6px;
  background:rgba(29,158,117,.15);border:1px solid rgba(29,158,117,.35);
  color:#5de8b8;font-size:11px;font-weight:700;letter-spacing:1px;
  padding:5px 14px;border-radius:20px;margin-bottom:14px;text-transform:uppercase;}
.ok-name{font-size:20px;font-weight:800;margin-bottom:4px;}
.ok-rol{display:inline-block;background:rgba(63,208,201,.13);border:1px solid var(--teal);
  color:var(--teal2);font-size:11px;font-weight:600;letter-spacing:.8px;
  padding:4px 14px;border-radius:12px;margin-bottom:8px;}
.ok-meta{font-size:11px;color:#7e93ad;line-height:1.8;}

/* ── Zona de foto ───────────────────────────────────── */
.photo-zone{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px;}
.ph-ring{width:120px;height:120px;border-radius:50%;cursor:pointer;position:relative;
  background:linear-gradient(135deg,var(--teal2),var(--teal) 55%,var(--gold));padding:3px;}
.ph-ring:hover .ph-ov{opacity:1;}
.ph-ov{position:absolute;inset:3px;border-radius:50%;background:rgba(6,15,31,.6);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  opacity:0;transition:opacity .2s;}
.ph-in{width:100%;height:100%;border-radius:50%;background:#0c1c33;overflow:hidden;
  display:flex;align-items:center;justify-content:center;}
.ph-in img{width:100%;height:100%;object-fit:cover;}
.ph-in svg{width:50%;height:50%;color:#9fb0c8;}
.ph-file{display:none;}
.ph-hint{font-size:12px;color:var(--gray2);text-align:center;line-height:1.6;max-width:260px;}
.ph-hint b{color:var(--teal2);}
.ph-reqs{font-size:11px;color:#5c7a9a;text-align:center;line-height:1.7;margin-top:-6px;}

/* ── Error box ──────────────────────────────────────── */
.err-box{background:rgba(226,75,74,.1);border:1px solid rgba(226,75,74,.28);
  border-radius:14px;padding:20px;text-align:center;margin-bottom:18px;}
.err-box .eico{font-size:34px;margin-bottom:8px;}
.err-box h3{margin:0 0 6px;font-size:15px;color:#f8807f;}
.err-box p{margin:0;font-size:13px;color:#c8a0a0;line-height:1.5;}

/* ── Carnet ─────────────────────────────────────────── */
.carnet-wrap{display:flex;justify-content:center;margin-bottom:20px;}
/* Proporciones PVC CR80: 54×85.6mm → ratio 0.6308 */
.card{
  width:252px;height:400px;
  background:radial-gradient(circle at 30% 0%,#103a52 0%,#060f1f 55%,#051018 100%);
  border-radius:13px;overflow:hidden;color:#fff;
  font-family:'Poppins',sans-serif;position:relative;
  box-shadow:0 22px 50px -10px rgba(6,15,31,.7),0 6px 16px rgba(6,15,31,.4);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;flex-shrink:0;
}
.card .wm{position:absolute;top:-36px;right:-62px;width:168px;height:173px;
  opacity:.11;transform:rotate(8deg);pointer-events:none;}
.card .inner{position:relative;padding:12px 14px 10px;height:100%;display:flex;flex-direction:column;}
/* Header */
.card .hdr{display:flex;align-items:center;gap:7px;margin-bottom:10px;}
.card .hdr img{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;}
.card .hdr .br{font-size:12px;font-weight:800;line-height:1.15;}
.card .hdr .br .pro{color:var(--teal2);}.card .hdr .br .muf{color:var(--gold);}
.card .hdr .br .sub{font-size:6px;color:#8ab0c8;font-weight:400;display:block;letter-spacing:.3px;}
/* Glass panel */
.card .gl{background:rgba(255,255,255,.08);border:.3px solid rgba(255,255,255,.22);
  border-radius:11px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;}
/* Photo */
.card .cr{width:65px;height:65px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#7fe3d4,#1aa39a 55%,#e6c468);padding:2px;margin-bottom:8px;}
.card .ci{width:100%;height:100%;border-radius:50%;background:#0c1c33;overflow:hidden;
  display:flex;align-items:center;justify-content:center;}
.card .ci img{width:100%;height:100%;object-fit:cover;}
.card .ci svg{width:52%;height:52%;color:#9fb0c8;}
/* Text */
.card .nm{font-size:13px;font-weight:800;text-align:center;line-height:1.2;margin-bottom:3px;}
.card .cd{font-size:8.5px;color:#a9c2d6;letter-spacing:.5px;margin-bottom:6px;}
.card .rp{background:rgba(63,208,201,.16);border:.3px solid #3fd0c9;color:#7fe3d4;
  font-size:9px;font-weight:700;letter-spacing:.5px;padding:3px 11px;
  border-radius:14px;margin-bottom:4px;text-align:center;}
.card .ins{font-size:8px;color:#5de8b8;letter-spacing:.3px;margin-bottom:5px;font-weight:500;}
.card .pr{font-size:7px;color:#7e93ad;letter-spacing:.3px;margin-bottom:8px;}
/* QR */
.card .qa{display:flex;flex-direction:column;align-items:center;margin-top:auto;}
.card .qb{background:#fff;padding:4px;border-radius:7px;width:90px;height:90px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1.5px #3fd0c9,0 0 14px rgba(63,208,201,.4);}
.card .qb img,.card .qb canvas{width:100%!important;height:100%!important;}
.card .qc{font-size:6px;color:#7e93ad;letter-spacing:.6px;margin-top:4px;text-align:center;}
.card .ft{margin-top:8px;font-size:7px;color:#516781;letter-spacing:1px;
  text-align:center;font-weight:600;}

/* ── Acciones carnet ─────────────────────────────────── */
.carnet-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}

/* ── Nota PDF ────────────────────────────────────────── */
.pdf-note{background:rgba(63,208,201,.07);border:1px solid rgba(63,208,201,.2);
  border-radius:12px;padding:14px 16px;font-size:12px;color:#8ab0c8;line-height:1.7;margin-bottom:16px;}
.pdf-note b{color:var(--teal2);display:block;margin-bottom:4px;}

/* ── PRINT (PDF via window.print) ───────────────────── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  body,html{background:white!important;margin:0;padding:0;height:85.6mm!important;overflow:hidden!important;}
  .tb,.pg .panel>*:not(.carnet-wrap),.carnet-actions,.pdf-note{display:none!important;}
  @page{size:54mm 85.6mm;margin:0;}
  .pg{padding:0;max-width:none;}
  .carnet-wrap{margin:0;}
  .card{
    width:54mm!important;height:85.6mm!important;border-radius:3mm!important;
    box-shadow:none!important;position:absolute;top:0;left:0;
  }
  .card .inner{padding:2.5mm 3mm 2mm!important;}
  .card .hdr{gap:1.5mm!important;margin-bottom:2mm!important;}
  .card .hdr img{width:6mm!important;height:6mm!important;}
  .card .hdr .br{font-size:2.8mm!important;}
  .card .hdr .br .sub{font-size:1.3mm!important;}
  .card .gl{border-radius:2mm!important;padding:2.5mm 2mm 2mm!important;}
  .card .cr{width:14mm!important;height:14mm!important;padding:.4mm!important;margin-bottom:1.5mm!important;}
  .card .nm{font-size:3mm!important;margin-bottom:1mm!important;}
  .card .cd{font-size:2mm!important;margin-bottom:1.5mm!important;}
  .card .rp{font-size:2.2mm!important;padding:.6mm 2.5mm!important;border-radius:3mm!important;margin-bottom:1mm!important;}
  .card .ins{font-size:1.8mm!important;margin-bottom:1mm!important;}
  .card .pr{font-size:1.7mm!important;margin-bottom:1.5mm!important;}
  .card .qa{margin-top:auto!important;}
  .card .qb{width:22mm!important;height:22mm!important;padding:1mm!important;border-radius:1.5mm!important;}
  .card .qc{font-size:1.4mm!important;margin-top:1mm!important;}
  .card .ft{font-size:1.8mm!important;margin-top:1.5mm!important;}
  .card .wm{top:-8mm!important;right:-14mm!important;width:38mm!important;height:38mm!important;}
}

.vpage{max-width:460px;margin:0 auto;padding:20px 16px 60px;}
.tb .vbadge{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.5px;
  padding:5px 12px;border-radius:10px;text-transform:uppercase;}
.vbadge.ok{background:rgba(29,158,117,.15);color:#5de8b8;border:1px solid rgba(29,158,117,.3);}
.vbadge.bad{background:rgba(226,75,74,.12);color:#f8807f;border:1px solid rgba(226,75,74,.28);}
.sbanner{border-radius:16px;padding:18px 20px;display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;}
.sbanner.ok{background:rgba(29,158,117,.12);border:1px solid rgba(29,158,117,.28);}
.sbanner.bad{background:rgba(226,75,74,.1);border:1px solid rgba(226,75,74,.25);}
.sbanner .ico{font-size:34px;flex-shrink:0;line-height:1;}
.sbanner .lbl{font-size:17px;font-weight:800;margin-bottom:3px;}
.sbanner.ok .lbl{color:#5de8b8;}.sbanner.bad .lbl{color:#f8807f;}
.sbanner .slb{font-size:12px;color:#8ab0c8;line-height:1.5;}
.pcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:18px;padding:28px 20px 22px;text-align:center;margin-bottom:16px;backdrop-filter:blur(6px);}
.vf-ring{width:104px;height:104px;border-radius:50%;margin:0 auto 16px;
  background:linear-gradient(135deg,var(--teal2),var(--teal) 55%,var(--gold));padding:3px;}
.pname{font-size:22px;font-weight:800;margin-bottom:5px;line-height:1.2;}
.pced{font-size:12px;color:#8ab0c8;letter-spacing:.5px;margin-bottom:14px;}
.prole{display:inline-block;background:rgba(63,208,201,.14);border:1px solid var(--teal);
  color:var(--teal2);font-size:12px;font-weight:700;letter-spacing:.8px;
  padding:6px 18px;border-radius:20px;margin-bottom:6px;}
.pinst{font-size:11.5px;color:#5de8b8;font-weight:500;margin-bottom:10px;letter-spacing:.3px;}
.pperiod{font-size:11px;color:#7e93ad;letter-spacing:.3px;}
.sec{margin-bottom:14px;}
.sec-t{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--teal2);
  text-transform:uppercase;margin-bottom:9px;}
.icard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;overflow:hidden;}
.irow{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;
  border-bottom:1px solid rgba(255,255,255,.05);}
.irow:last-child{border-bottom:none;}
.irow .ico{font-size:16px;flex-shrink:0;margin-top:1px;}
.ilbl{font-size:10px;color:#7e93ad;letter-spacing:.3px;margin-bottom:2px;}
.ival{font-size:13px;font-weight:500;color:#e0eaf5;line-height:1.4;}
.seal{background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.25);
  border-radius:14px;padding:18px;text-align:center;margin-bottom:14px;}
.seal .s-ico{font-size:28px;margin-bottom:8px;}
.seal .s-title{font-size:13px;font-weight:700;color:#5de8b8;margin-bottom:4px;}
.seal .s-sub{font-size:11px;color:#5a8a7a;line-height:1.5;}
.seal.bad-seal{background:rgba(226,75,74,.08);border-color:rgba(226,75,74,.22);}
.seal.bad-seal .s-title{color:#f8807f;}
.seal.bad-seal .s-sub{color:#8a5a5a;}
.footer{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
  border-radius:14px;padding:18px;text-align:center;}
.footer .fl{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px;}
.footer img{width:26px;height:26px;border-radius:50%;}
.footer .fn{font-size:13px;font-weight:700;}.fn .pro{color:var(--teal2);}.fn .muf{color:var(--gold);}
.footer .fi{font-size:10.5px;color:#3a5070;line-height:1.7;margin-top:6px;}
.footer a{color:var(--teal);text-decoration:none;}
.sbox{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:65vh;gap:14px;text-align:center;padding:40px 24px;}
.sbox .big{font-size:48px;}.sbox h2{font-size:17px;margin:0;color:#e0eaf5;}
.sbox p{font-size:13px;color:#7e93ad;margin:0;line-height:1.6;}

.mo{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);justify-content:center;align-items:center;padding:14px;}
.mo.on{display:flex;}
.ml2{background:var(--navy3);border:1px solid rgba(255,255,255,.12);border-radius:16px;width:100%;max-width:380px;max-height:92vh;overflow-y:auto;padding:22px;}
.ml2 h2{font-size:16px;margin-bottom:14px;}
.mx{background:none;border:none;color:#8ab0c8;font-size:20px;cursor:pointer;float:right;}
.mx:hover{color:#fff;}
.tt-wrap{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;max-width:90vw;}
.t2{padding:11px 16px;border-radius:12px;font-size:12.5px;font-weight:600;box-shadow:0 4px 24px rgba(0,0,0,.35);}
.t2-s{background:var(--green);color:#04120d;}.t2-e{background:var(--red);color:#fff;}.t2-i{background:var(--teal);color:#062824;}
.tb-admin{margin-left:auto;display:flex;align-items:center;gap:8px;}
.tb-admin .tlink{background:none;border:none;color:#7e93ad;font-size:11px;cursor:pointer;text-decoration:underline;font-family:'Poppins',sans-serif;}
.tb-admin .tlink:hover{color:var(--teal2);}
.tb-admin .tpill{background:rgba(63,208,201,.13);border:1px solid var(--teal);color:var(--teal2);font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:12px;cursor:pointer;font-family:'Poppins',sans-serif;}
.tb-admin .tpill:hover{opacity:.85;}
.tb-admin .tsess{font-size:10px;color:#7e93ad;}

.g-in:focus{border-color:var(--teal);}
.g-in:disabled{opacity:.6;}
select.g-in option{background:var(--navy3);color:#fff;}

.g-panel h3{font-size:14px;margin-bottom:14px;color:#fff;}
.g-panel h3 .tag{color:#7e93ad;font-weight:400;font-size:11px;margin-left:6px;}
.g-list-item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;cursor:pointer;}

.g-fotoprev img{width:100%;height:100%;object-fit:cover;}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normCedula(s){
  const numero = String(s||'').replace(/\D/g,'');
  return numero ? 'V-'+numero : '';
}
function mesActualYYYYMM(){ return new Date().toISOString().slice(0,7); }
function toast(msg, tipo){
  const d = document.createElement('div');
  d.className = 't2 t2-'+(tipo||'i');
  d.textContent = msg;
  $('ttWrap').appendChild(d);
  setTimeout(()=>d.remove(), 3400);
}
function set(html){ $('app').innerHTML = html; }

/* ═══════════ CONFIG + FIREBASE ═══════════ */
async function loadConfigJson(){
  try{
    const appBase = location.pathname.split('/modulos/carnet/')[0] + '/';
    const r = await fetch(appBase+'config.json?_='+Date.now());
    if(r.ok) cfg = await r.json();
  }catch(e){ console.error('[config]', e); }
}
function initFirebase(){
  if(!cfg.firebase || !cfg.firebase.projectId) return null;
  if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg.firebase);
  db = firebase.firestore();
  attachAuthListener();
  return db;
}

/* ═══════════ AUTENTICACIÓN ═══════════ */
let authListenerAttached = false;
function attachAuthListener(){
  if(authListenerAttached) return;
  if(!(firebase.apps && firebase.apps.length)) return;
  authListenerAttached = true;
  firebase.auth().onAuthStateChanged(async user=>{
    if(!user){
      try{ await firebase.auth().signInAnonymously(); }
      catch(e){ console.error('[Auth] anon falló', e); }
      return;
    }
    currentUser = user;
    if(user.isAnonymous){
      $('btnLoginLink').style.display='';
      $('sesionInfo').style.display='none';
      $('btnGestion').style.display='none';
      $('btnLogoutLink').style.display='none';
    } else {
      $('btnLoginLink').style.display='none';
      $('sesionInfo').style.display='';
      $('sesionInfo').textContent = user.email||'Tesorero';
      $('btnGestion').style.display='';
      $('btnLogoutLink').style.display='';
      closeLogin();
      toast('Sesión iniciada como '+(user.email||'Tesorero'),'s');
    }
  }, err=>console.error('[Auth]', err));
}
function openLogin(){ $('loginError').textContent=''; $('loginPass').value=''; $('moLogin').classList.add('on'); $('loginEmail').focus(); }
function closeLogin(){ $('moLogin').classList.remove('on'); }
async function doLogin(){
  const email = $('loginEmail').value.trim(), pass = $('loginPass').value;
  $('loginError').textContent='';
  if(!email || !pass){ $('loginError').textContent='Indica correo y contraseña.'; return; }
  const btn = $('btnLoginSubmit'); btn.disabled=true; btn.textContent='Entrando…';
  try{ await firebase.auth().signInWithEmailAndPassword(email, pass); }
  catch(e){
    $('loginError').textContent = {
      'auth/invalid-email':'Correo inválido.', 'auth/user-not-found':'No existe una cuenta con ese correo.',
      'auth/wrong-password':'Contraseña incorrecta.', 'auth/invalid-credential':'Correo o contraseña incorrectos.',
      'auth/too-many-requests':'Demasiados intentos. Espera unos minutos.'
    }[e.code] || 'No se pudo iniciar sesión.';
  }finally{ btn.disabled=false; btn.textContent='Entrar'; }
}
async function doLogout(){
  try{ showStep1(); await firebase.auth().signOut(); toast('Sesión cerrada','i'); await firebase.auth().signInAnonymously(); }
  catch(e){ console.error(e); }
}

/* ═══════════ CONSULTA (STEP 1 → STEP 3), mismo flujo visual del original ═══════════ */
function showStep1(){
  $('verapp').style.display='none'; $('app').parentElement.style.display='block';
  set([
    '<div class="panel">',
      '<div class="ptitle">Consulta tu carnet</div>',
      '<div class="psub">Escribe tu c&eacute;dula para ver tu carnet digital de PROMUF.</div>',
      '<div class="ced-wrap"><span class="ced-pre">V-</span>',
        '<input class="ced-in" id="cedInput" inputmode="numeric" placeholder="12.345.678" onkeydown="if(event.key===\'Enter\')buscarCarnet()">',
      '</div>',
      '<div class="ced-hint">Solo n&uacute;meros, sin puntos ni guiones</div>',
      '<button class="btn btn-teal" onclick="buscarCarnet()">🔎 Ver mi carnet</button>',
    '</div>'
  ].join(''));
}
function showLoading(msg){
  set('<div class="loading"><div class="spin"></div><div class="spin-msg">'+esc(msg)+'</div></div>');
}
function showErrorBox(msg, backFn){
  set([
    '<div class="panel">',
      '<div class="err-box"><div class="eico">⚠️</div><h3>Algo sali&oacute; mal</h3><p>'+esc(msg)+'</p></div>',
      '<button class="btn btn-ghost" id="btnBackErr">← Volver</button>',
    '</div>'
  ].join(''));
  $('btnBackErr').addEventListener('click', backFn);
}
async function buscarCarnet(){
  const cedula = normCedula('V-'+($('cedInput').value||''));
  if(!$('cedInput').value.trim()){ toast('Escribe tu cédula','e'); return; }
  if(!db){ toast('No hay conexión con el servidor. Recarga la página.','e'); return; }
  showLoading('Buscando tu carnet…');
  try{
    const snap = await db.collection('socios').doc(cedula).get();
    if(!snap.exists){ showErrorBox('No se encontró un carnet con esa cédula. Contacta al Tesorero para que registre tu ficha.', showStep1); return; }
    showStep3(snap.data());
  }catch(e){ console.error(e); showErrorBox('No se pudo consultar en este momento. Intenta de nuevo.', showStep1); }
}
function fotoHtmlFor(b64){ return b64 ? '<img src="'+b64+'" alt="">' : AV; }
function urlVerificacion(cedula){ return location.origin + location.pathname + '?verificar=' + encodeURIComponent(cedula); }

            '<div class="cr"><div class="ci">'+fotoHtml+'</div></div>',

            '<div class="cd">'+esc(m.cedula)+'</div>',
            '<div class="rp">'+esc(m.cargo||'Miembro')+'</div>',

            '<div class="qa"><div class="qb" id="qr-box"></div><div class="qc">VERIFICAR MEMBRESÍA</div></div>',
          '</div>',
          '<div class="ft">'+esc(m.numero_carnet||m.cedula)+' &nbsp;·&nbsp; PROMUF</div>',
        '</div>',
      '</div></div>',

      '<div class="carnet-actions">',
        '<button class="btn btn-gold" id="btn-pdf">⬇ Descargar PDF para imprimir</button>',
        '<button class="btn btn-ghost" id="btn-perfil">👁 Ver perfil público</button>',
        '<button class="btn btn-ghost" id="btn-nuevo">🔄 Consultar otra cédula</button>',
      '</div>',

      '<div class="pdf-note"><b>📋 Instrucciones para imprimir en PVC</b>',
        '1. Haz clic en "Descargar PDF".<br>',
        '2. El PDF tiene las medidas exactas de una tarjeta PVC (CR80: 85.6 × 54 mm).<br>',
        '3. Llévalo a cualquier imprenta que haga tarjetas PVC o carnets.',
      '</div>',
    '</div>'
  ].join(''));

  $('btn-pdf').addEventListener('click', ()=>{
    const old = document.title;
    document.title = 'Carnet ' + m.nombre + ' · PROMUF';
    window.print();
    setTimeout(()=>document.title=old, 2000);
  });
  $('btn-perfil').addEventListener('click', ()=>window.open(urlVerificacion(m.cedula),'_blank'));
  $('btn-nuevo').addEventListener('click', showStep1);

  (function renderQR(){
    const el = $('qr-box');
    if(el && window.QRCode) new QRCode(el, {text:urlVerificacion(m.cedula), width:90, height:90, colorDark:'#0a1830', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
    else if(el) setTimeout(renderQR, 250);
  })();
}

/* ═══════════ VERIFICACIÓN PÚBLICA (?verificar=cedula), estilo Perfil.html ═══════════ */
async function mostrarVerificacion(cedula){
  $('app').parentElement.style.display='none';
  const el = $('verapp');
  el.style.display='block';
  el.innerHTML = '<div class="sbox"><div class="spin"></div><p>Verificando membresía…</p></div>';
  try{
    const snap = await db.collection('socios').doc(cedula).get();
    if(!snap.exists){

    const m = snap.data();
    const hoy = new Date().toISOString().slice(0,10);

    const mesHasta = m.mes_pagado_hasta || null;

          : (!vigente ? 'El período de este carnet no está vigente.' : 'El socio no está al día con su membresía.')+'<br>Período: '+esc(m.periodo_inicio||'—')+' – '+esc(m.periodo_fin||'—'))+'</div></div>',
      '</div>',

      '<div class="pcard">',
        '<div class="vf-ring"><div class="ph-in">'+foto+'</div></div>',
        '<div class="pname">'+esc(m.nombre)+'</div>',
        '<div class="pced">'+esc(m.cedula)+'</div>',
        '<div class="prole">'+esc(m.cargo||'Miembro')+'</div>',
        '<div class="pperiod">Período '+esc(m.periodo_inicio||'—')+' — '+esc(m.periodo_fin||'—')+'</div>',
      '</div>',

      '<div class="sec"><div class="sec-t">Datos del agremiado</div><div class="icard">',
        '<div class="irow"><div class="ico">🪪</div><div><div class="ilbl">Cédula de identidad</div><div class="ival">'+esc(m.cedula)+'</div></div></div>',
        '<div class="irow"><div class="ico">🏛</div><div><div class="ilbl">Cargo</div><div class="ival">'+esc(m.cargo||'Miembro')+'</div></div></div>',
        '<div class="irow"><div class="ico">🏷️</div><div><div class="ilbl">N° de carnet</div><div class="ival">'+esc(m.numero_carnet||m.cedula)+'</div></div></div>',
        '<div class="irow"><div class="ico">📅</div><div><div class="ilbl">Vigencia del carnet</div><div class="ival">'+esc(m.periodo_inicio||'—')+' – '+esc(m.periodo_fin||'—')+'</div></div></div>',
        '<div class="irow"><div class="ico">💳</div><div><div class="ilbl">Membresía pagada hasta</div><div class="ival">'+(mesHasta?esc(mesHasta):'Sin pagos registrados')+'</div></div></div>',
        '<div class="irow"><div class="ico">📍</div><div><div class="ilbl">Gremio</div><div class="ival">PROMUF · Estado Falcón, Venezuela</div></div></div>',
      '</div></div>',

      ok
        ? '<div class="seal"><div class="s-ico">🔏</div><div class="s-title">Carnet verificado por PROMUF</div><div class="s-sub">Verificado el '+new Date().toLocaleDateString('es-VE',{day:'2-digit',month:'long',year:'numeric'})+'</div></div>'
        : '<div class="seal bad-seal"><div class="s-ico">⚠️</div><div class="s-title">Carnet no válido actualmente</div><div class="s-sub">Para más información contacta directamente al Tesorero de PROMUF.</div></div>',

      '<div class="footer"><div class="fl"><img src="'+LOGO+'"><div class="fn"><span class="pro">PRO</span><span class="muf">MUF</span></div></div>',
        '<div class="fi">Profesionales de la Música de Falcón<br>Sistema oficial de verificación de membresía</div></div>',
    ].join('');
  }catch(e){
    console.error(e);
    el.innerHTML = '<div class="sbox"><div class="big">⚠️</div><h2>Error de conexión</h2><p>No se pudo verificar la membresía. Verifica tu internet.</p></div>';
  }
}

function onFotoChosen(file){
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = e => { img.onload = () => comprimirFoto(img); img.src = e.target.result; };
  reader.readAsDataURL(file);
}
function comprimirFoto(img){
  const maxDim = 320;
  let w = img.width, h = img.height;
  if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
  else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  const b64 = canvas.toDataURL('image/jpeg', 0.6);
  fotoB64Pendiente = b64;
  $('gFotoPrev').innerHTML = '<img src="'+b64+'">';
  const kb = Math.round(b64.length/1024);
  $('gFotoInfo').textContent = 'Foto comprimida a ~'+kb+' KB (queda dentro del documento, sin usar Storage).';
}

async function cargarSocioAdmin(){
  const cedula = normCedula('V-'+($('gCedInput').value||''));
  if(!$('gCedInput').value.trim()){ toast('Escribe una cédula','e'); return; }
  if(!db){ toast('Sin conexión con el servidor','e'); return; }
  try{
    const snap = await db.collection('socios').doc(cedula).get();
    const s = snap.exists ? snap.data() : {cedula};
    $('gForm').style.display='block';
    $('gCedula').value = cedula;
    $('gNombre').value = s.nombre||'';
    $('gCargo').value = s.cargo||'Miembro';
    $('gNumero').value = s.numero_carnet||'';
    $('gDesde').value = s.periodo_inicio||'';
    $('gHasta').value = s.periodo_fin||'';
    fotoB64Pendiente = s.foto_b64||null;
    $('gFotoPrev').innerHTML = fotoHtmlFor(s.foto_b64);
    $('gError').textContent='';
    $('gInfoPago').textContent = s.mes_pagado_hasta
      ? ('Estado de membresía (según pagos aprobados): pagado hasta '+s.mes_pagado_hasta)
      : 'Estado de membresía (según pagos aprobados): sin pagos aprobados aún';
    toast(snap.exists ? 'Ficha cargada' : 'Cédula nueva: completa los datos para crearla','i');
  }catch(e){ console.error(e); toast('No se pudo cargar (¿tu cuenta está en /admins?)','e'); }
}

async function guardarSocioAdmin(){
  $('gError').textContent='';
  const cedula = $('gCedula').value;
  const nombre = $('gNombre').value.trim();
  if(!cedula || !nombre){ $('gError').textContent='Falta el nombre.'; return; }
  try{
    await db.collection('socios').doc(cedula).set({
      cedula, nombre,
      cargo: $('gCargo').value,
      numero_carnet: $('gNumero').value.trim() || null,
      periodo_inicio: $('gDesde').value || null,
      periodo_fin: $('gHasta').value || null,
      foto_b64: fotoB64Pendiente || null
    }, {merge:true});
    toast('Ficha guardada','s');
    cargarListaSocios();
  }catch(e){ console.error(e); $('gError').textContent='No se pudo guardar (revisa el tamaño de la foto o tu sesión).'; }
}

async function cargarListaSocios(){
  const cont = $('gLista');
  if(!db || !cont) return;
  cont.innerHTML = '<div class="loading"><div class="spin"></div></div>';
  try{
    const snap = await db.collection('socios').orderBy('nombre').limit(200).get();
    if(snap.empty){ cont.innerHTML = '<div style="font-size:12px;color:#7e93ad">Todavía no hay socios registrados.</div>'; return; }
    cont.innerHTML = snap.docs.map(d=>{
      const s = d.data();
      return '<div class="g-list-item" onclick="document.getElementById(\'gCedInput\').value=\''+esc(s.cedula||'').replace('V-','')+'\';cargarSocioAdmin()">'
        + '<div><div class="gn">'+esc(s.nombre||'(sin nombre)')+'</div><div class="gd">'+esc(s.cedula)+' · '+esc(s.cargo||'Miembro')+'</div></div>'
        + '<div class="gd">'+(s.mes_pagado_hasta?('Al día: '+s.mes_pagado_hasta):'Sin pagos')+'</div>'
        + '</div>';
    }).join('');
  }catch(e){ console.error(e); cont.innerHTML = '<div style="font-size:12px;color:#f8807f">No se pudo cargar el listado.</div>'; }
}
