<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carnetización Digital · PROMUF</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a1830;--bg2:#0e2244;--bg3:#12294f;
    --tx:#f1f5f9;--tx2:#8ab0c8;--tx3:#5b7a94;
    --bd:rgba(255,255,255,.09);
    --teal:#3fd0c9;--teal2:#7fe3d4;
    --gold:#e6c468;--gold2:#d4af37;
    --gr:#1d9e75;--ro:#e24b4a;--am:#eab308;
    --r:12px;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#0d1e3a 0%,var(--bg) 60%);color:var(--tx);min-height:100vh}
  .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
  .hd .br{font-size:15px;font-weight:800}
  .hd .br .pro{color:var(--teal2)}.hd .br .muf{color:var(--gold)}
  .hd-r{display:flex;align-items:center;gap:12px}
  .tabs{display:flex;background:rgba(255,255,255,.03);border-bottom:1px solid var(--bd);overflow-x:auto;padding:0 12px}
  .tab{background:none;border:none;color:var(--tx2);padding:11px 16px;font-size:.82rem;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap;font-family:inherit}
  .tab.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:700}
  .tc{display:none;padding:20px;max-width:820px;margin:0 auto}.tc.on{display:block}
  .cs{background:var(--bg2);border-radius:var(--r);padding:18px;border:1px solid var(--bd);margin-bottom:18px}
  .cs h3{font-size:.9rem;margin-bottom:12px}
  .cs h3 .tag{color:var(--tx3);font-weight:400;font-size:.72rem;margin-left:6px}
  .in{width:100%;padding:9px 12px;border-radius:var(--r);border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--tx);font-size:.85rem;outline:none;font-family:inherit}
  .in:focus{border-color:var(--teal)}
  select.in option{background:var(--bg2);color:var(--tx)}
  .fg2{margin-bottom:13px}
  .fg2 label{display:block;font-size:.72rem;color:var(--tx2);margin-bottom:4px;font-weight:600}
  .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .btn{padding:10px 18px;border-radius:var(--r);border:none;cursor:pointer;font-size:.82rem;font-weight:700;transition:.2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .bt{background:linear-gradient(135deg,var(--teal),#1aa39a);color:#06332f}
  .bo{background:rgba(255,255,255,.07);border:1px solid var(--bd);color:#c8d8ec}
  .bo:hover{border-color:var(--teal);color:var(--teal)}
  .note{font-size:.72rem;color:var(--tx3);line-height:1.6;margin-top:6px}
  .err{color:var(--ro);font-weight:700}
  body.pub-mode .no-pub{display:none!important}
  .ld{text-align:center;padding:30px;color:var(--tx2);font-size:.8rem}
  .ld .spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(63,208,201,.2);border-top-color:var(--teal);animation:sp .8s linear infinite;margin:0 auto 10px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tt{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:7px}
  .t{padding:10px 16px;border-radius:var(--r);font-size:.78rem;font-weight:600;box-shadow:0 4px 24px rgba(0,0,0,.3)}
  .t-s{background:var(--gr);color:#04120d}.t-e{background:var(--ro);color:#fff}.t-i{background:var(--teal);color:#06332f}
  .mo{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);justify-content:center;align-items:center;padding:14px}
  .mo.on{display:flex}
  .ml2{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;padding:20px}
  .mx{background:none;border:none;color:var(--tx2);font-size:1.3rem;cursor:pointer;float:right}

  /* ── Carnet visual (pantalla) ── */
  .card-wrap{display:flex;justify-content:center;margin:18px 0}
  .card{width:280px;background:linear-gradient(160deg,#0d1e3a,#060f1f);border:1px solid var(--bd);border-radius:16px;padding:18px;text-align:center;position:relative;overflow:hidden}
  .card .hdr{font-size:.72rem;font-weight:800;margin-bottom:10px}
  .card .hdr .pro{color:var(--teal2)}.card .hdr .muf{color:var(--gold)}
  .ph-ring{width:88px;height:88px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,var(--teal2),var(--teal) 55%,var(--gold));padding:3px}
  .ph-in{width:100%;height:100%;border-radius:50%;background:#0c1c33;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2rem}
  .ph-in img{width:100%;height:100%;object-fit:cover}
  .card .nm{font-size:1.05rem;font-weight:800}
  .card .cd{font-size:.72rem;color:var(--tx2);margin:2px 0 8px;letter-spacing:.5px}
  .card .rp{display:inline-block;background:rgba(63,208,201,.14);border:1px solid var(--teal);color:var(--teal2);font-size:.68rem;font-weight:700;padding:4px 14px;border-radius:14px;margin-bottom:8px}
  .card .pr{font-size:.66rem;color:var(--tx3);margin-bottom:12px}
  .card .qb{width:110px;height:110px;background:#fff;border-radius:8px;margin:0 auto;padding:6px}
  .card .ft{font-size:.62rem;color:var(--tx3);margin-top:10px}

  .banner{border-radius:var(--r);padding:16px 18px;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
  .banner.ok{background:rgba(29,158,117,.12);border:1px solid rgba(29,158,117,.35)}
  .banner.bad{background:rgba(226,75,74,.1);border:1px solid rgba(226,75,74,.3)}
  .banner .ic{font-size:1.5rem}
  .banner .tt2{font-weight:700;font-size:.9rem}
  .banner.ok .tt2{color:var(--gr)}.banner.bad .tt2{color:var(--ro)}
  .banner .sb{font-size:.74rem;color:var(--tx2);margin-top:2px}

  .avatar-up{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .avatar-up .prev{width:64px;height:64px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:1.6rem;flex-shrink:0}
  .avatar-up .prev img{width:100%;height:100%;object-fit:cover}

  .mi{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;cursor:pointer}
  .mi:hover{border-color:var(--teal)}
  .mi .mn{font-weight:700;font-size:.82rem}
  .mi .md{color:var(--tx3);font-size:.7rem}

  @media print{
    body *{visibility:hidden}
    #printArea, #printArea *{visibility:visible}
    #printArea{position:absolute;top:0;left:0;width:54mm;height:85.6mm}
    @page{size:54mm 85.6mm;margin:0}
    .card{width:54mm!important;height:85.6mm!important;border-radius:3mm!important;padding:4mm 3mm!important}
    .ph-ring{width:16mm!important;height:16mm!important;margin-bottom:2mm!important}
    .card .hdr{font-size:2.6mm!important;margin-bottom:2mm!important}
    .card .nm{font-size:3.4mm!important}
    .card .cd{font-size:2.2mm!important}
    .card .rp{font-size:2.2mm!important;padding:1mm 3mm!important;margin-bottom:2mm!important}
    .card .pr{font-size:1.8mm!important;margin-bottom:2mm!important}
    .card .qb{width:22mm!important;height:22mm!important}
    .card .ft{font-size:1.8mm!important;margin-top:2mm!important}
  }
  @media(max-width:640px){.hd{padding:10px 14px}.tc{padding:14px}}
</style>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="hd" id="hdBar">
  <div class="br"><span class="pro">PRO</span><span class="muf">MUF</span></div>
  <div class="hd-r">
    <span class="note no-pub" id="sesionInfo" style="margin:0"></span>
    <button class="btn bo" id="btnLogin" onclick="openLogin()" style="display:none">🔑 Acceso Tesorero</button>
    <button class="btn bo no-pub" id="btnLogout" onclick="doLogout()" style="display:none">🚪 Cerrar sesión</button>
  </div>
</div>

<div class="tabs" id="tabsBar">
  <button class="tab" data-t="micarnet" onclick="go('micarnet')">🪪 Mi carnet</button>
  <button class="tab no-pub" data-t="gestion" onclick="go('gestion')">🗂 Gestión de socios</button>
</div>

<!-- ═══════════ TAB: MI CARNET ═══════════ -->
<div class="tc" id="tc-micarnet">
  <div class="cs">
    <h3>Consulta tu carnet <span class="tag">búsqueda por cédula</span></h3>
    <div class="row2" style="align-items:flex-end">
      <div class="fg2" style="margin-bottom:0"><label>Cédula</label><input class="in" id="buscarCedula" placeholder="V-12345678" onkeydown="if(event.key==='Enter')buscarMiCarnet()"></div>
      <button class="btn bt" onclick="buscarMiCarnet()">🔎 Buscar</button>
    </div>
    <div class="err" id="buscarError" style="min-height:16px;font-size:.76rem;margin-top:8px"></div>
  </div>
  <div id="miCarnetResultado"></div>
</div>

<!-- ═══════════ TAB: GESTIÓN DE SOCIOS (ADMIN) ═══════════ -->
<div class="tc" id="tc-gestion">
  <div class="cs">
    <h3>Gestión de socios <span class="tag">solo Tesorero</span></h3>
    <div class="row2" style="align-items:flex-end;margin-bottom:14px">
      <div class="fg2" style="margin-bottom:0"><label>Buscar por cédula</label><input class="in" id="gCedulaBusq" placeholder="V-12345678" onkeydown="if(event.key==='Enter')cargarSocioAdmin()"></div>
      <button class="btn bo" onclick="cargarSocioAdmin()">Cargar / crear</button>
    </div>

    <div id="gForm" style="display:none">
      <div class="row2">
        <div class="fg2"><label>Cédula</label><input class="in" id="gCedula" disabled></div>
        <div class="fg2"><label>Nombre completo</label><input class="in" id="gNombre"></div>
      </div>
      <div class="row2">
        <div class="fg2">
          <label>Cargo / rol</label>
          <select class="in" id="gCargo">
            <option value="Miembro">Miembro</option><option>Presidente</option>
            <option>Vicepresidente</option><option>Tesorero</option>
            <option>Secretario</option><option>Vocal</option><option>Otro</option>
          </select>
        </div>
        <div class="fg2"><label>N° de carnet (opcional)</label><input class="in" id="gNumero" placeholder="PMF-26-001"></div>
      </div>
      <div class="row2">
        <div class="fg2"><label>Vigencia desde</label><input class="in" id="gDesde" type="date"></div>
        <div class="fg2"><label>Vigencia hasta</label><input class="in" id="gHasta" type="date"></div>
      </div>
      <div class="fg2">
        <label>Foto (se comprime automáticamente, no usa Storage)</label>
        <div class="avatar-up">
          <div class="prev" id="gFotoPrev">🙂</div>
          <input type="file" accept="image/*" id="gFotoFile" onchange="onFotoChosen(this.files[0])">
        </div>
        <div class="note" id="gFotoInfo"></div>
      </div>
      <div class="note" id="gInfoPago" style="margin-bottom:10px"></div>
      <div class="err" id="gError" style="min-height:16px;font-size:.76rem"></div>
      <button class="btn bt" onclick="guardarSocioAdmin()">💾 Guardar ficha</button>
    </div>
  </div>

  <div class="cs">
    <h3>Socios registrados <span class="tag">toca uno para editarlo</span></h3>
    <div id="gLista"><div class="ld"><div class="spin"></div>Cargando…</div></div>
  </div>
</div>

<!-- ═══════════ VISTA DE VERIFICACIÓN PÚBLICA (?verificar=) ═══════════ -->
<div id="verificarView" style="display:none;max-width:420px;margin:0 auto;padding:20px"></div>

<!-- ═══════════ MODAL LOGIN ═══════════ -->
<div class="mo" id="moLogin">
  <div class="ml2">
    <button class="mx" onclick="closeLogin()">✕</button>
    <h2 style="font-size:1rem;margin-bottom:14px">🔑 Acceso del Tesorero</h2>
    <div class="fg2"><label>Correo</label><input class="in" id="loginEmail" type="email" autocomplete="username"></div>
    <div class="fg2"><label>Contraseña</label><input class="in" id="loginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="note" id="loginError" style="color:var(--ro);min-height:16px"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn bt" id="btnLoginSubmit" onclick="doLogin()">Entrar</button>
      <button class="btn bo" onclick="closeLogin()">Cancelar</button>
    </div>
  </div>
</div>

<div class="tt" id="ttWrap"></div>

<script>
const $ = id => document.getElementById(id);
let cfg = {}, db = null, currentUser = null, fotoB64Pendiente = null;

function toast(msg, tipo){
  const d = document.createElement('div');
  d.className = 't t-'+(tipo||'i');
  d.textContent = msg;
  $('ttWrap').appendChild(d);
  setTimeout(()=>d.remove(), 3400);
}
function normCedula(s){ return (s||'').trim().toUpperCase().replace(/\s+/g,''); }
function mesActualYYYYMM(){ return new Date().toISOString().slice(0,7); }

/* ═══════════ NAVEGACIÓN ═══════════ */
function go(id){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.t===id));
  document.querySelectorAll('.tc').forEach(c=>c.classList.toggle('on', c.id==='tc-'+id));
  if(id==='gestion' && currentUser && !currentUser.isAnonymous) cargarListaSocios();
}

/* ═══════════ CONFIG + FIREBASE ═══════════ */
async function loadConfigJson(){
  try{
    const appBase = location.pathname.split('/modulos-carnet/')[0] + '/';
    const r = await fetch(appBase+'config.json?_='+Date.now());
    if(r.ok) cfg = await r.json();
  }catch(e){ console.error('[config]', e); }
}
function initFirebase(){
  if(!cfg.firebase || !cfg.firebase.projectId) return null;
  if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg.firebase);
  db = firebase.firestore();
  attachAuthListener();
  return db;
}

/* ═══════════ AUTENTICACIÓN ═══════════ */
let authListenerAttached = false;
function attachAuthListener(){
  if(authListenerAttached) return;
  if(!(firebase.apps && firebase.apps.length)) return;
  authListenerAttached = true;
  firebase.auth().onAuthStateChanged(async user=>{
    if(!user){
      try{ await firebase.auth().signInAnonymously(); }
      catch(e){ console.error('[Auth] anon falló', e); }
      return;
    }
    currentUser = user;
    if(user.isAnonymous){
      document.body.classList.add('pub-mode');
      $('btnLogin').style.display='';
      $('btnLogout').style.display='none';
      $('sesionInfo').textContent='';
    } else {
      document.body.classList.remove('pub-mode');
      $('btnLogin').style.display='none';
      $('btnLogout').style.display='';
      $('sesionInfo').textContent='👤 '+(user.email||'Tesorero');
      closeLogin();
      toast('Sesión iniciada como '+(user.email||'Tesorero'),'s');
      if(document.querySelector('.tab.on')?.dataset.t==='gestion') cargarListaSocios();
    }
  }, err=>console.error('[Auth]', err));
}
function openLogin(){ $('loginError').textContent=''; $('loginPass').value=''; $('moLogin').classList.add('on'); $('loginEmail').focus(); }
function closeLogin(){ $('moLogin').classList.remove('on'); }
async function doLogin(){
  const email = $('loginEmail').value.trim(), pass = $('loginPass').value;
  $('loginError').textContent='';
  if(!email || !pass){ $('loginError').textContent='Indica correo y contraseña.'; return; }
  const btn = $('btnLoginSubmit'); btn.disabled=true; btn.textContent='Entrando…';
  try{ await firebase.auth().signInWithEmailAndPassword(email, pass); }
  catch(e){
    $('loginError').textContent = {
      'auth/invalid-email':'Correo inválido.', 'auth/user-not-found':'No existe una cuenta con ese correo.',
      'auth/wrong-password':'Contraseña incorrecta.', 'auth/invalid-credential':'Correo o contraseña incorrectos.',
      'auth/too-many-requests':'Demasiados intentos. Espera unos minutos.'
    }[e.code] || 'No se pudo iniciar sesión.';
  }finally{ btn.disabled=false; btn.textContent='Entrar'; }
}
async function doLogout(){
  try{ await firebase.auth().signOut(); toast('Sesión cerrada','i'); await firebase.auth().signInAnonymously(); }
  catch(e){ console.error(e); }
}

/* ═══════════ TARJETA: HTML REUTILIZABLE ═══════════ */
function fotoHtml(b64){ return b64 ? `<img src="${b64}">` : '🙂'; }
function renderCard(socio, opts){
  opts = opts || {};
  const qrTarget = opts.qrId || ('qr_'+Math.random().toString(36).slice(2));
  const vigenteHasta = socio.periodo_fin || '';
  const html = `
    <div class="card" id="${opts.cardId||''}">
      <div class="hdr"><span class="pro">PRO</span><span class="muf">MUF</span></div>
      <div class="ph-ring"><div class="ph-in">${fotoHtml(socio.foto_b64)}</div></div>
      <div class="nm">${esc(socio.nombre||'(sin nombre)')}</div>
      <div class="cd">${esc(socio.cedula||'')}</div>
      <div class="rp">${esc(socio.cargo||'Miembro')}</div>
      <div class="pr">${socio.periodo_inicio||'—'} · ${vigenteHasta||'—'}</div>
      <div class="qb" id="${qrTarget}"></div>
      <div class="ft">${esc(socio.numero_carnet||socio.cedula||'')} · PROMUF</div>
    </div>`;
  return {html, qrTarget};
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderQR(elId, url){
  const el = $(elId);
  if(el && window.QRCode) new QRCode(el, {text:url, width:180, height:180, colorDark:'#0a1830', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
  else if(el) setTimeout(()=>renderQR(elId,url), 250);
}
function urlVerificacion(cedula){
  return location.origin + location.pathname + '?verificar=' + encodeURIComponent(cedula);
}

/* ═══════════ MI CARNET (público) ═══════════ */
async function buscarMiCarnet(){
  const cedula = normCedula($('buscarCedula').value);
  $('buscarError').textContent=''; $('miCarnetResultado').innerHTML='';
  if(!cedula){ $('buscarError').textContent='Escribe tu cédula.'; return; }
  if(!db){ $('buscarError').textContent='No hay conexión con el servidor. Recarga la página.'; return; }
  $('miCarnetResultado').innerHTML = '<div class="ld"><div class="spin"></div>Buscando…</div>';
  try{
    const snap = await db.collection('socios').doc(cedula).get();
    if(!snap.exists){
      $('miCarnetResultado').innerHTML = '<div class="cs"><div class="note">No se encontró un carnet con esa cédula. Contacta al Tesorero para que registre tu ficha.</div></div>';
      return;
    }
    mostrarMiCarnet(snap.data());
  }catch(e){ console.error(e); $('miCarnetResultado').innerHTML=''; $('buscarError').textContent='No se pudo buscar. Intenta de nuevo.'; }
}
function mostrarMiCarnet(socio){
  const mesHasta = socio.mes_pagado_hasta || null;
  const alDia = mesHasta && mesHasta >= mesActualYYYYMM();
  const {html, qrTarget} = renderCard(socio, {cardId:'printArea'});
  $('miCarnetResultado').innerHTML = `
    <div class="cs">
      <div class="banner ${alDia?'ok':'bad'}">
        <div class="ic">${alDia?'✅':'⚠️'}</div>
        <div><div class="tt2">${alDia?'Al día con tu membresía':'Membresía pendiente'}</div>
        <div class="sb">${mesHasta?('Pagado hasta '+mesHasta):'Aún no se registra ningún pago aprobado.'}</div></div>
      </div>
      <div id="printArea">
        <div class="card-wrap">${html}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px">
        <button class="btn bt" onclick="window.print()">⬇ Descargar / imprimir PDF</button>
      </div>
      <div class="note" style="text-align:center;margin-top:8px">El botón genera un PDF con el tamaño exacto de una tarjeta PVC (CR80, 54×85.6mm).</div>
    </div>`;
  renderQR(qrTarget, urlVerificacion(socio.cedula));
}

/* ═══════════ VERIFICACIÓN PÚBLICA (?verificar=cedula) ═══════════ */
async function mostrarVerificacion(cedula){
  document.getElementById('hdBar').style.display='none';
  document.getElementById('tabsBar').style.display='none';
  document.querySelectorAll('.tc').forEach(c=>c.classList.remove('on'));
  const el = $('verificarView');
  el.style.display='block';
  el.innerHTML = '<div class="ld"><div class="spin"></div>Verificando…</div>';
  try{
    const snap = await db.collection('socios').doc(cedula).get();
    if(!snap.exists){
      el.innerHTML = '<div class="banner bad"><div class="ic">❌</div><div><div class="tt2">Carnet no encontrado</div><div class="sb">No existe un registro con esta cédula.</div></div></div>';
      return;
    }
    const s = snap.data();
    const hoy = new Date().toISOString().slice(0,10);
    const vigente = (!s.periodo_fin || hoy <= s.periodo_fin) && (!s.periodo_inicio || hoy >= s.periodo_inicio);
    const mesHasta = s.mes_pagado_hasta || null;
    const alDia = mesHasta && mesHasta >= mesActualYYYYMM();
    el.innerHTML = `
      <div class="banner ${vigente?'ok':'bad'}">
        <div class="ic">${vigente?'✅':'❌'}</div>
        <div><div class="tt2">${vigente?'Carnet vigente':'Carnet vencido'}</div>
        <div class="sb">${s.periodo_inicio||'—'} – ${s.periodo_fin||'—'}</div></div>
      </div>
      <div class="cs" style="text-align:center">
        <div class="ph-ring" style="width:96px;height:96px"><div class="ph-in">${fotoHtml(s.foto_b64)}</div></div>
        <div class="nm" style="margin-top:8px">${esc(s.nombre||'')}</div>
        <div class="cd">${esc(s.cedula||'')}</div>
        <div class="rp">${esc(s.cargo||'Miembro')}</div>
      </div>
      <div class="banner ${alDia?'ok':'bad'}">
        <div class="ic">${alDia?'💳':'⚠️'}</div>
        <div><div class="tt2">${alDia?'Al día con la membresía':'Membresía pendiente'}</div>
        <div class="sb">${mesHasta?('Pagado hasta '+mesHasta):'Sin pagos aprobados registrados'}</div></div>
      </div>
      <div class="note" style="text-align:center">Verificación PROMUF · Profesionales de la Música de Falcón</div>`;
  }catch(e){ console.error(e); el.innerHTML = '<div class="note err">No se pudo verificar en este momento.</div>'; }
}

  if(!db){ toast('Sin conexión con el servidor','e'); return; }

    const s = snap.exists ? snap.data() : {cedula};
    $('gForm').style.display='block';
    $('gCedula').value = cedula;

    $('gCargo').value = s.cargo||'Miembro';

    fotoB64Pendiente = s.foto_b64||null;

}

function onFotoChosen(file){
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = e => { img.onload = () => comprimirFoto(img); img.src = e.target.result; };
  reader.readAsDataURL(file);
}
function comprimirFoto(img){
  const maxDim = 320;
  let w = img.width, h = img.height;
  if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
  else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  const b64 = canvas.toDataURL('image/jpeg', 0.6);
  fotoB64Pendiente = b64;
  $('gFotoPrev').innerHTML = `<img src="${b64}">`;
  const kb = Math.round(b64.length/1024);
  $('gFotoInfo').textContent = `Foto comprimida a ~${kb} KB (queda dentro del documento, sin usar Storage).`;
  if(kb > 250) $('gFotoInfo').textContent += ' Es un poco pesada; si falla al guardar, prueba con otra foto más simple.';
}

async function guardarSocioAdmin(){
  $('gError').textContent='';
  const cedula = $('gCedula').value;
  const nombre = $('gNombre').value.trim();
  if(!cedula || !nombre){ $('gError').textContent='Falta el nombre.'; return; }
  try{
    await db.collection('socios').doc(cedula).set({
      cedula,
      nombre,
      cargo: $('gCargo').value,
      numero_carnet: $('gNumero').value.trim() || null,
      periodo_inicio: $('gDesde').value || null,
      periodo_fin: $('gHasta').value || null,
      foto_b64: fotoB64Pendiente || null
    }, {merge:true});
    toast('Ficha guardada','s');
    cargarListaSocios();
  }catch(e){ console.error(e); $('gError').textContent='No se pudo guardar (revisa el tamaño de la foto o tu sesión).'; }
}

async function cargarListaSocios(){
  const cont = $('gLista');
  if(!db){ return; }
  cont.innerHTML = '<div class="ld"><div class="spin"></div>Cargando…</div>';
  try{
    const snap = await db.collection('socios').orderBy('nombre').limit(200).get();
    if(snap.empty){ cont.innerHTML = '<div class="note">Todavía no hay socios registrados.</div>'; return; }
    cont.innerHTML = snap.docs.map(d=>{
      const s = d.data();
      return `<div class="mi" onclick="$('gCedulaBusq').value='${s.cedula}';cargarSocioAdmin()">
        <div><div class="mn">${esc(s.nombre||'(sin nombre)')}</div><div class="md">${esc(s.cedula)} · ${esc(s.cargo||'Miembro')}</div></div>
        <div class="md">${s.mes_pagado_hasta?('Al día: '+s.mes_pagado_hasta):'Sin pagos'}</div>
      </div>`;
    }).join('');
  }catch(e){ console.error(e); cont.innerHTML = '<div class="note err">No se pudo cargar el listado.</div>'; }
}
